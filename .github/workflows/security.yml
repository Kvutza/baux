name: Security Audit & Pages Provenance

on:
  push:
    branches:
      - main
      - gh-pages
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Strict least-privilege default: all jobs start with zero token permissions.
permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  security-audit:
    name: Static Analysis & Dependency Audit
    if: github.ref != 'refs/heads/gh-pages'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # Required to check out repository sources
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Audit GitHub Actions workflows with zizmor
        run: uvx zizmor --pedantic -qq --no-progress --color=never .github/workflows/

      - name: Enforce public-tree allowlist with standalone Rust verifier
        run: |
          rustc --edition 2021 -O -D warnings --cfg pages_verify_cli \
            rust/crates/cli/src/bin/baux/pages_verify.rs -o /tmp/verify-pages
          /tmp/verify-pages --tree .

      - name: Validate and run custom Semgrep rules
        env:
          SEMGREP_SEND_METRICS: "off"
          NO_COLOR: "1"
        run: |
          SEMGREP_SEND_METRICS=off SEMGREP_ENABLE_VERSION_CHECK=0 \
            uvx semgrep scan --quiet --metrics=off --disable-version-check --validate --config .semgrep/security.yml
          mapfile -t scan_files < <(
            git ls-files \
              'python/**' \
              'admin/ops/**' \
              'admin/ui/**' \
              'admin/tools/**' \
              'admin/toolchains/**' \
              'forest/theme/**' \
              'forest/js/**'
          )
          if [ "${#scan_files[@]}" -gt 0 ]; then
            SEMGREP_SEND_METRICS=off SEMGREP_ENABLE_VERSION_CHECK=0 \
              uvx semgrep scan --quiet --metrics=off --disable-version-check --no-git-ignore --error --config .semgrep/security.yml \
              --exclude node_modules \
              --exclude forester.js \
              --exclude __pycache__ \
              --exclude _build \
              --exclude fonts \
              "${scan_files[@]}"
          fi

      - name: Audit locked Python dependencies with pip-audit
        run: |
          uv export --frozen --no-emit-project --no-hashes --output-file /tmp/baux-locked-requirements.txt
          uvx pip-audit --strict --no-deps --disable-pip -r /tmp/baux-locked-requirements.txt

  verify-and-attest-pages:
    name: Verify & Attest gh-pages Bundle
    if: (github.event_name == 'push' && github.ref == 'refs/heads/gh-pages') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read # Required to check out main verifier scripts and gh-pages bundle
      attestations: write # Required by actions/attest-build-provenance to publish SLSA attestations
      id-token: write # Required for Sigstore OIDC signing of SLSA build provenance
    steps:
      - name: Checkout verifier scripts from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: verifier
          persist-credentials: false

      - name: Checkout public bundle from gh-pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: bundle
          persist-credentials: false

      - name: Verify gh-pages bundle with standalone Rust verifier and archive subject
        run: |
          rustc --edition 2021 -O -D warnings --cfg pages_verify_cli \
            verifier/rust/crates/cli/src/bin/baux/pages_verify.rs -o /tmp/verify-pages
          /tmp/verify-pages --bundle bundle
          tar --exclude='./.git' -C bundle -czf /tmp/pages-bundle.tar.gz .

      - name: Attest SLSA build provenance for gh-pages bundle
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: /tmp/pages-bundle.tar.gz
