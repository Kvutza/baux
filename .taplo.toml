# Taplo configuration file for TOML Language Server (taplo-lsp) and formatter.
# Provides instant auto-completion, hover docs, and formatting
# across VS Code, Cursor, Zed, Helix, and Neovim.

[formatting]
column_width = 80
array_auto_expand = true
array_auto_collapse = false

[[rule]]
include = ["research/upstream/coverage_manifest.toml"]

[rule.formatting]
column_width = 240
array_auto_expand = false
array_auto_collapse = true
