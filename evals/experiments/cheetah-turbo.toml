[experiment]
env = 'cheetah'
policy = 'simba'
num_arms = 1
num_rounds = 10000
num_denoise_passive = 1

[optimizer]
algorithm = 'turbo-enn'

[optimizer.proposal]
generator = 'independent'
distribution = 'gaussian'

[optimizer.surrogate]
estimator = 'enn'
index = 'metal'
neighbors = 10
neighbor_rule = 'fixed'
epistemic_scale = 0.1
aleatoric_scale = 0.05
y_scale = 1.0
fit = 'fixed'

[optimizer.acquisition]
function = 'upper-confidence-bound'
beta = 1.0

[optimizer.trust_region]
policy = 'turbo'
initial = 0.05
min = 0.001
max = 0.2
success_threshold = 3
failure_threshold = 4
