#:schema ../schemas/tune-spec.schema.json
version = 4
experiment = "pretrain"
model = "fbt-pisa1-mhc4-v1"

[data]
recipe = "fineweb-slowrun-100m-v1"

[objective]
function = "cross-entropy"
window-tokens = 4096

[execution]
rounds = 128
round-target-ms = 200
validation-interval = 1

[optimizer]
algorithm = "operator-bo"
proposal = "independent"
arms = 1
candidates = 1
distribution = "gaussian"

[optimizer.surrogate]
scaling = "global"
neighbors = 10
neighbor-rule = "fixed"
epistemic-scale = 0.1
aleatoric-scale = 0.05
y-scale = 0.005
fit = "fixed"

[optimizer.trust-region]
shape = "tensor-family-static"
initial = 0.004
min = 0.001
max = 0.008
