#:schema ../schemas/tune-spec.schema.json
# Native MHC4 (No H-Net) Bayesian optimization with ENN at 1M context.
# Model: fbt-pisa1-mhc4-v1 (4-stream mHC Sinkhorn state mixer, PISA-1 sparse attention, routed MoE).
version = 4

experiment = "pretrain"
model = "fbt-pisa1-mhc4-v1"

[data]
recipe = "stack-v3-rust-go-v1"

[objective]
function = "cross-entropy"
sampling = "natural"
window-tokens = 1048576

[execution]
rounds = 256
round-target-ms = 1000

[evaluation]
interval = 64

[optimizer]
algorithm = "turbo-enn"

[optimizer.candidate-generation]
generator = "pair-rotation"
arms = 2
candidates = 4

[optimizer.candidate-generation.perturbation]
distribution = "gaussian"

[optimizer.surrogate]
estimator = "enn"
scaling = "global"
neighbors = 10
neighbor-rule = "fixed"
epistemic-scale = 0.05
aleatoric-scale = 0.05

fit = "leave-one-out"
fit-candidates = 30
fit-samples = 10

[optimizer.acquisition]
function = "upper-confidence-bound"

[optimizer.trust-region]
policy = "turbo"
shape = "tensor-family-static"
initial = 0.002
min = 0.001
max = 0.032

[diagnostics]
stage-samples = 3
