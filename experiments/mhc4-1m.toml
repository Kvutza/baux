#:schema ../schemas/tune-spec.schema.json
# Native MHC4 Bayesian optimization with ENN at 1M context.
# Model: fbt-pisa1-mhc4-v1 (4-stream mHC Sinkhorn state mixer, PISA-1 sparse attention, routed MoE).
version = 4
experiment = "pretrain"
model = "fbt-pisa1-mhc4-v1"
recipe = "stack-v3-rust-go-v1"
objective = "cross-entropy"
window-tokens = 1048576
rounds = 256
round-target-ms = 1000
validation-interval = 64
stage-samples = 3

[optimizer]
algorithm = "turbo-enn"
arms = 2
candidates = 4
distribution = "gaussian"
acquisition = "upper-confidence-bound"

[optimizer.surrogate]
neighbors = 10
epistemic-scale = 0.05
aleatoric-scale = 0.05
fit = "leave-one-out"
fit-candidates = 30
fit-samples = 10

[optimizer.trust-region]
shape = "tensor-family-static"
initial = 0.002
min = 0.001
max = 0.032
