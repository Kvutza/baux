#:schema ../schemas/tune-spec.schema.json
version = 4
experiment = "pretrain"
model = "fbt-pisa1-mhc4-v1"
recipe = "stack-v3-rust-go-v1"
objective = "cross-entropy"
window-tokens = 4096
rounds = 256
round-target-ms = 200
validation-interval = 256
stage-samples = 3

[optimizer]
algorithm = "operator-bo"
distribution = "gaussian"

[optimizer.surrogate]
metric = "conformal"
neighbors = 8
epistemic-scale = 0.05
aleatoric-scale = 0.05
fit = "leave-one-out"
fit-candidates = 30
fit-samples = 10

[optimizer.trust-region]
shape = "tensor-family-static"
initial = 0.004
min = 0.001
max = 0.032
