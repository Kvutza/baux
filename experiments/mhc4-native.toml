#:schema ../schemas/tune-spec.schema.json
version = 4
experiment = "pretrain"
model = "fbt-pisa1-mhc4-v1"

[data]
recipe = "stack-v3-rust-go-v1"

[objective]
function = "cross-entropy"
window-tokens = 4096

[execution]
rounds = 256
round-target-ms = 200
validation-interval = 256
stage-samples = 3

[optimizer]
algorithm = "operator-bo"
proposal = "independent"
arms = 1
candidates = 1
distribution = "gaussian"

[optimizer.surrogate]
scaling = "self-tuning"
neighbors = 8
neighbor-rule = "fixed"
epistemic-scale = 0.05
aleatoric-scale = 0.05
fit = "leave-one-out"
fit-candidates = 4
fit-samples = 4

[optimizer.trust-region]
shape = "tensor-family-static"
initial = 0.004
min = 0.001
max = 0.032
