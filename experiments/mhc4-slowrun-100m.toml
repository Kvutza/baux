#:schema ../schemas/tune-spec.schema.json
version = 4
experiment = "pretrain"
model = "fbt-pisa1-mhc4-v1"
recipe = "fineweb-slowrun-100m-v1"
objective = "cross-entropy"
window-tokens = 2048
rounds = 48832
round-target-ms = 200
validation-interval = 512
stage-samples = 3

[optimizer]
algorithm = "operator-bo"
proposal = "lie"
distribution = "gaussian"

[optimizer.surrogate]
metric = "conformal"
neighbors = 16
epistemic-scale = 0.1
aleatoric-scale = 0.05
y-scale = 0.005
fit = "leave-one-out"
fit-candidates = 30
fit-samples = 10

[optimizer.trust-region]
shape = "tensor-family-static"
initial = 0.004
min = 0.001
max = 0.032
