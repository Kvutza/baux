#:schema ../schemas/tune-spec.schema.json
version = 4

experiment = "pretrain"
model = "fbt-pisa1-mhc4-v1"

[data]
recipe = "fineweb-slowrun-100m-v1"

[objective]
function = "cross-entropy"
sampling = "natural"
window-tokens = 2048

[execution]
rounds = 48832
round-target-ms = 200

[evaluation]
interval = 512

[optimizer]
algorithm = "operator-bo"

[optimizer.candidate-generation]
generator = "independent"
arms = 1
candidates = 1

[optimizer.candidate-generation.perturbation]
distribution = "gaussian"

[optimizer.surrogate]
estimator = "knn"
scaling = "global"
neighbors = 16
neighbor-rule = "fixed"
epistemic-scale = 0.1
aleatoric-scale = 0.05
y-scale = 0.005
fit = "fixed"

[optimizer.acceptance]
criterion = "positive-improvement"

[optimizer.radius-control]
policy = "turbo"
shape = "tensor-family-static"
initial = 0.04
min = 0.01
max = 0.8

[diagnostics]
stage-samples = 3
