#:schema ../schemas/tune-spec.schema.json
version = 4
experiment = "pretrain"
model = "fbt-pisa1-mhc4-v1"
recipe = "fineweb-slowrun-100m-v1"
objective = "cross-entropy"
window-tokens = 2048
rounds = 48832
round-target-ms = 200
validation-interval = 512
stage-samples = 3

[optimizer]
algorithm = "operator-bo"
proposal = "independent"
distribution = "gaussian"

[optimizer.surrogate]
neighbors = 16
epistemic-scale = 0.1
aleatoric-scale = 0.05
y-scale = 0.005

[optimizer.trust-region]
shape = "tensor-family-static"
initial = 0.04
min = 0.01
max = 0.8
