#:schema ../schemas/tune-spec.schema.json
version = 4
experiment = "pretrain"
model = "fbt-pisa1-mhc4-v1"
recipe = "fineweb-slowrun-100m-v1"
objective = "bounded-log-likelihood"
window-tokens = 2048
rounds = 200
round-target-ms = 250
validation-interval = 100
stage-samples = 3

[optimizer]
algorithm = "operator-bo"
proposal = "lie"
distribution = "gaussian"

[optimizer.surrogate]
scaling = "hyperbolic"
local-neighbors = 4
neighbors = 16
epistemic-scale = 0.1
aleatoric-scale = 0.05
y-scale = 0.005
fit = "leave-one-out"
fit-candidates = 10
fit-samples = 10

[optimizer.trust-region]
shape = "scalar"
initial = 0.004
min = 0.0001
max = 0.016
