[project]
name = "baux"
version = "0.0.1"
requires-python = ">=3.14,<3.16"
dependencies = [
  "ax-platform>=1.3.1,<1.4",
  "botorch>=0.18.1,<0.19",
  "click==8.5.0",
  "gpytorch>=1.11",
  "numpy>=2.1",
  "optuna>=5.0,<5.1",
  "scipy>=1.11",
  "torch>=2.0",
]

[dependency-groups]
pretrain = [
  "datasets==5.0.1",
  "tokenizers==0.21.4",
]

[tool.uv]
package = false
constraint-dependencies = [
  "certifi>=2026.10.19",
  "fsspec>=2026.6.0",
  "aiohttp>=3.14.4",
]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [
  "archive",
  ".cache",
  ".kiss",
  ".pixi",
  ".venv",
  "buck-out",
  "dist",
  "target",
  "vendor",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]

[tool.ty.environment]
root = ["./src", "."]

[tool.ty.src]
include = ["src"]
exclude = [
  "archive",
  ".cache",
  ".kiss",
  ".pixi",
  ".venv",
  "buck-out",
  "dist",
  "target",
  "vendor",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
addopts = ""
testpaths = ["tests"]
python_files = ["test*.py"]
norecursedirs = ["bazel-*"]
markers = [
  "slow: optional long-running stress tests (deselect with '-m \"not slow\"')",
  "gp: tests for the optional Torch and GPyTorch surrogate",
]
filterwarnings = ["ignore::DeprecationWarning:importlib._bootstrap"]
