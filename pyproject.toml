[project]
name = "baux"
version = "0.0.5"
requires-python = ">=3.12,<3.16"
dependencies = [
  "ax-platform>=1.3.1,<1.4",
  "botorch>=0.18.1,<0.19",
  "click==8.5.0",
  "gpytorch>=1.11",
  "numpy>=2.1",
  "optuna>=5.0,<5.1",
  "scipy>=1.11",
  "torch>=2.0",
]

[dependency-groups]
compiler = [
  "optree==0.20.0",
  "jax==0.12.0.1",
  "jaxlib==0.12.0.1",
  "iree-base-compiler==3.13.0",
  "iree-base-runtime==3.13.1",
  "pytest==9.2.0",
]
pretrain = [
  "datasets==5.0.1",
  "tokenizers==0.21.4",
]

[tool.uv]
package = false
constraint-dependencies = [
  "certifi>=2026.10.19",
  "filelock>=4.2.1",
  "fsspec>=2026.6.0",
  "aiohttp>=3.14.4",
]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = [
  "archive",
  ".cache",
  ".kiss",
  ".pixi",
  ".venv",
  "buck-out",
  "dist",
  "target",
  "vendor",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "BLE", "D"]
ignore = ["E402", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "BLE001"]
"admin/**" = ["D100", "D101", "D102", "D103", "D104", "BLE001", "B905"]
"scripts/**" = ["D100", "D101", "D102", "D103", "D104", "BLE001", "B905"]
"ocaml/**" = ["D100", "D101", "D102", "D103", "D104", "BLE001", "B905"]
"research/**" = ["D100", "D101", "D102", "D103", "D104", "BLE001", "B905"]

[tool.ty.environment]
root = ["./python", "./admin", "."]

[tool.ty.src]
include = ["python"]
exclude = [
  "archive",
  ".cache",
  ".kiss",
  ".pixi",
  ".venv",
  "buck-out",
  "dist",
  "target",
  "vendor",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
addopts = ""
pythonpath = ["python", "admin", "."]
testpaths = ["tests"]
python_files = ["test*.py"]
norecursedirs = ["bazel-*"]
markers = [
  "slow: optional long-running stress tests (deselect with '-m \"not slow\"')",
  "gp: tests for the optional Torch and GPyTorch surrogate",
]
filterwarnings = ["ignore::DeprecationWarning:importlib._bootstrap"]
