  "fit.rs (compute_loglik & loo_neighbors): local evaluates -0.5*ln(2*pi) - ln(se) - 0.5*((y - mu)/se)^2 without squaring se (avoiding binary64 se*se underflow below 1e-154) and excludes held-out LOO rows by exact row ID (id != held) rather than distance threshold 1e-15",
  "knn (ExactBackend vs FaissBackend and smnsrch): local in-memory ExactBackend computes exact binary64 squared-L2 distances (matching baux::semantics::neighbor and upstream small_n_search f64 bit-for-bit), while local BpAnnDisk smnsrch uses binary32 resident flat cache (matching upstream FaissBackend f32 bit-for-bit)",
  "acquisition.rs (UCBAcquisition & ParetoAcquisition::nondomin_2d): local uses a deterministic streaming min-heap without advancing RNG in UCB and an O(n log n) 2D sweep in Pareto non-dominated sorting",
  "candidates.rs (generate_raasp): local clamps num_pert to num_dim and selects perturbed coordinates without replacement via partial Fisher-Yates (Knuth 3.4.2P) rather than sampling num_pert coordinates with replacement",
  "surrogate.rs (ENNSurrogate::run_fitter): local refreshes finite-sample ARD coordinate weights via model.refresh_finite as soon as n >= 2 under MetricLearning::Auto",
]

