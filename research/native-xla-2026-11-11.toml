changes = [
  "Added a private ownership adapter over the pinned public PJRT C API, with RAII cleanup and exception containment.",
  "Preserve all input buffers by disabling donation; await upload, execution and readback events before exposing completion.",
  "Host readback requests dense row-major layout, independent of compiler-chosen device layouts.",
  "Encode declared input ShapeProtos in compile options so XLA rejects incorrect types and shapes, including equal-byte-size mismatches.",
  "Check native parameter/output counts; shared Rust contracts enforce session identity and output shape/type.",
  "Expose compile_xla through the Rust executable, Python NativeSession and typed OxCaml program APIs.",
  "Remove the Python-backed BackendQueue and QueuedAdapter execution path.",
  "Export transitive native runtime dependencies and package the PJRT bridge, plugin and license.",
  "Reuse the native-compiler workspace's Rust metadata-pipelining fix after reproducing its E0463 failure.",
]
limitations = [
  "Native XLA execution is currently available on macOS arm64 CPU only. Metal requests fail explicitly; GPU XLA and other host builds remain unfinished.",
  "IREE CPU/Metal and TVM CPU share the runtime; TVM still compiles in an isolated Python process in this workspace.",
  "The separate native-compiler workspace has overlapping work that has not yet been integrated.",
  "This evidence establishes functional correctness and ownership, not throughput or 1M-context latency improvements.",
  "Compiled programs use one replica and one partition; distributed multi-device execution is not implemented.",
]

