task = "blckbaux-vnv"
date = "2026-11-04"
scope = "Complete causal sequence through initialized Mhc4 model, PISA, vocabulary readout and cross-entropy loss. No optimizer steps. Weight and decoder construction excluded."
interpretation = [
  "All requested tokens are scored. Long contexts use 8192-row chunks and retain per-visit KV across chunks.",
  "Three measured passes per context; no separate warmup. Medians include sample zero.",
  "Fresh initialized weights and deterministic synthetic tokens, not a trained checkpoint or corpus quality evaluation.",
  "Finite loss and coverage checks pass; these runs do not independently establish long-context reference parity or a causal speedup.",
  "Profiles are separate instrumented passes at 4K and 64K; no 1M stage profile was collected.",
  "A tooling rebuild overlapped part of the 64K profile; profiling numbers are diagnostic, not a controlled baseline.",
  "No CUDA runtime measurement on this machine. No latency-target success is claimed.",
]

