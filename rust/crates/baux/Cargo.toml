[package]
name = "baux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Black-box optimization library"
readme = false
include = [
  "src/**",
  "semantics/src/**",
  "neighbor-index/src/**",
  "artifact/src/**",
  "examples/**",
  "tests/**",
  "Cargo.toml",
  "LICENSE",
  "NOTICE",
]

[lints]
workspace = true

[dependencies]
anstream = "1.0"
anstyle = "1.0"
charming = { version = "=0.6.0", default-features = false, optional = true }
deser.workspace = true
deser-cbor = "=0.9.1"
deser-json = { version = "=0.9.1", features = ["speedups"] }
deser-toml = "=0.9.1"
deser-value = "=0.9.1"
jiff = "=0.2.38"
kuva = { version = "=0.6.0", default-features = false, optional = true }
memmap2 = { version = "0.9", optional = true }
ndarray = { workspace = true }
rand = "0.8"
rand_distr = { workspace = true }
rayon = "1.10"
redb = { version = "=2.6.4", optional = true }
sha2 = "0.10"
sobol = "1.0.2"
thiserror = { workspace = true }
usearch = { version = "2.26", optional = true, default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.33.0", optional = true }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
cuda-core = { workspace = true, optional = true }

[features]
default = ["host-db", "disk-bpann"]
host-db = ["dep:redb", "dep:charming", "dep:kuva"]
disk-bpann = ["dep:memmap2"]
buck2-test-data = []
cuda = ["dep:cuda-core"]
extraction = []
native-flame = ["cuda"]
metal = ["dep:metal"]
usearch = ["dep:usearch"]
usearch-native = []
usearch-numkong = ["dep:usearch", "usearch/numkong"]

[dev-dependencies]
numpy = { workspace = true }
rand_chacha = "0.3"
tempfile = "3"

[[example]]
name = "knn_bench"
required-features = ["metal"]
