[package]
name = "baux-fbt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
baux.workspace = true
deser.workspace = true
memmap2 = "0.9"
ndarray.workspace = true
rand.workspace = true
rand_distr.workspace = true
rayon = "1.10"
sha2.workspace = true
tokenizers = { version = "0.23.1", default-features = false, features = [
  "fancy-regex",
] }

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.33.0", optional = true, features = ["mps"] }

[features]
default = ["metal"]
buck2-test-data = ["baux/buck2-test-data"]
metal = ["dep:metal", "baux/metal"]

[dev-dependencies]
rand_chacha = "0.3"
tempfile = "3"

[[bin]]
name = "baux-tune-worker"
path = "src/bin/baux-tune-worker/main.rs"
