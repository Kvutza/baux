[package]
name = "baux-properties"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
baux.workspace = true
baux-fbt = { workspace = true, default-features = false }
baux-tokamak = { workspace = true, default-features = false }
hegeltest = { version = "=0.50.2", features = ["static-engine"] }
ndarray.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.33.0", optional = true }

[features]
default = []
metal = ["dep:metal", "baux/metal", "baux-fbt/metal", "baux-tokamak/metal"]
